<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S-B-U ONLINE WORK</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;font-family:Arial,sans-serif}
  body{margin:0;background:#0f172a;color:white;display:flex;justify-content:center;min-height:100vh;padding:16px}
  .box{width:100%;max-width:420px;background:#1e293b;padding:24px;border-radius:16px;margin:auto}
  h1{text-align:center;font-size:22px;margin:0 0 6px}
  p.sub{text-align:center;color:#94a3b8;font-size:14px;margin:0 0 20px}
  .tabs{display:flex;background:#0f172a;padding:4px;border-radius:10px;margin-bottom:20px}
  .tabs button{flex:1;padding:12px;border:0;border-radius:8px;cursor:pointer;font-weight:bold;background:transparent;color:#94a3b8}
  .tabs button.active{background:#f59e0b;color:black}
  label{font-size:13px;color:#cbd5e1}
  input{width:100%;padding:13px;margin:6px 0 14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:white;font-size:16px;outline:none}
  .main-btn{width:100%;padding:14px;border:0;border-radius:10px;background:#f59e0b;color:black;font-weight:bold;font-size:16px;cursor:pointer}
  .main-btn:disabled{opacity:0.6}
  #msg{text-align:center;margin-top:14px;font-size:14px;min-height:20px;color:#fbbf24}
  #dashboard{display:none}
  .card{background:#0f172a;padding:16px;border-radius:12px;margin-top:14px}
  .logout{width:100%;padding:12px;margin-top:14px;border:0;border-radius:10px;background:#ef4444;color:white;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<!-- LOGIN / REGISTER SCREEN -->
<div class="box" id="authBox">
  <h1>S-B-U ONLINE WORK</h1>
  <p class="sub">Enter your MTN or Airtel number</p>

  <div class="tabs">
    <button id="tabLogin" class="active" onclick="showTab('login')">LOGIN</button>
    <button id="tabRegister" onclick="showTab('register')">REGISTER</button>
  </div>

  <!-- LOGIN FORM -->
  <div id="loginForm">
    <label>Phone Number</label>
    <input id="loginPhone" type="tel" placeholder="e.g. 0770492890" maxlength="10">
    <button class="main-btn" id="loginBtn" onclick="doLogin()">Login</button>
  </div>

  <!-- REGISTER FORM -->
  <div id="registerForm" style="display:none">
    <label>Full Name</label>
    <input id="regName" type="text" placeholder="e.g. John Doe">
    <label>Phone Number</label>
    <input id="regPhone" type="tel" placeholder="e.g. 0770492890" maxlength="10">
    <button class="main-btn" id="regBtn" onclick="doRegister()">Create Account</button>
  </div>

  <div id="msg"></div>
</div>

<!-- DASHBOARD SCREEN -->
<div class="box" id="dashboard">
  <h1>Welcome 👋</h1>
  <p class="sub" id="welcomeText"></p>
  <div class="card">
    <b>Your Phone:</b> <span id="dashPhone"></span><br><br>
    <b>Your Name:</b> <span id="dashName"></span><br><br>
    <b>Balance:</b> UGX 0
  </div>
  <button class="logout" onclick="doLogout()">Logout</button>
</div>

<script>
  // === PASTE YOUR REAL KEYS HERE FROM SUPABASE > SETTINGS > API ===
  const SUPABASE_URL = "PASTE_YOUR_SUPABASE_URL_HERE";
  const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showTab(tab){
    document.getElementById('tabLogin').classList.toggle('active', tab==='login');
    document.getElementById('tabRegister').classList.toggle('active', tab==='register');
    document.getElementById('loginForm').style.display = tab==='login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab==='register' ? 'block' : 'none';
    document.getElementById('msg').innerText = '';
  }

  function cleanPhone(p){ return p.replace(/\D/g,'').trim(); }

  async function doLogin(){
    const phone = cleanPhone(document.getElementById('loginPhone').value);
    const btn = document.getElementById('loginBtn');
    const msg = document.getElementById('msg');
    if(phone.length !== 10){ msg.innerText = "Enter 10 digits e.g. 0770492890"; return; }
    btn.disabled = true; btn.innerText = "Checking..."; msg.innerText = "";

    const { data, error } = await supabase
      .from('profiles')
      .select('*')
      .eq('phone', phone)
      .maybeSingle();

    btn.disabled = false; btn.innerText = "Login";

    if(error){ msg.innerText = "Error: " + error.message; return; }
    if(!data){ msg.innerText = "No account found. Please tap REGISTER."; return; }

    showDashboard(data);
  }

  async function doRegister(){
    const name = document.getElementById('regName').value.trim();
    const phone = cleanPhone(document.getElementById('regPhone').value);
    const btn = document.getElementById('regBtn');
    const msg = document.getElementById('msg');
    if(!name){ msg.innerText = "Enter your name"; return; }
    if(phone.length !== 10){ msg.innerText = "Enter 10 digits e.g. 0770492890"; return; }
    btn.disabled = true; btn.innerText = "Creating..."; msg.innerText = "";

    const { data: existing } = await supabase.from('profiles').select('*').eq('phone', phone).maybeSingle();
    if(existing){ btn.disabled=false; btn.innerText="Create Account"; msg.innerText="This number already exists. Please tap LOGIN."; return; }

    const { data, error } = await supabase
      .from('profiles')
      .insert([{ phone: phone, full_name: name }])
      .select()
      .single();

    btn.disabled = false; btn.innerText = "Create Account";
    if(error){ msg.innerText = "Error: " + error.message; return; }
    showDashboard(data);
  }

  function showDashboard(user){
    document.getElementById('authBox').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('dashPhone').innerText = user.phone || '';
    document.getElementById('dashName').innerText = user.full_name || user.name || 'User';
    document.getElementById('welcomeText').innerText = "Logged in as " + (user.full_name || user.phone);
    localStorage.setItem('sbu_phone', user.phone);
  }

  function doLogout(){
    localStorage.removeItem('sbu_phone');
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('authBox').style.display = 'block';
  }
</script>
</body>
</html>
