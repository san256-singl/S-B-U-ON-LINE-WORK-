<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SBU Online Work</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f2f2f2;text-align:center;padding:15px}
.card{background:#fff;padding:15px;border-radius:12px;max-width:420px;margin:auto}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
button{background:#2563eb;color:#fff;border:none;font-weight:bold}
.hide{display:none}
.work{background:#f9f9f9;padding:10px;margin:8px 0;border-radius:8px;text-align:left}
</style>
</head>
<body>
<div class="card">
<h2>SBU Online Work</h2>
<div id="auth">
<input id="phone" placeholder="Phone e.g 0771234567" type="tel">
<input id="pass" placeholder="Password (6+ chars)" type="password">
<input id="name" placeholder="Full Name">
<button onclick="register()">REGISTER</button>
<button onclick="login()" style="background:#16a34a">LOGIN</button>
<p id="msg" style="color:red"></p>
</div>
<div id="pay" class="hide">
<h3>Pay 12,000 to Activate</h3>
<p>Send 12,000 to <b>0758502917</b> via Airtel / MTN</p>
<input id="txid" placeholder="Enter Transaction ID">
<button onclick="submitPay()">I HAVE PAID</button>
</div>
<div id="app" class="hide">
<h3>Welcome <span id="uname"></span></h3>
<p>Balance: <b><span id="bal">0</span> UGX</b></p>
<div id="works"></div>
<button onclick="logout()" style="background:#666">LOGOUT</button>
</div>
</div>
<script>
const SUPABASE_URL = "https://dhaqrimlmxgzyqhzggjn.supabase.co";
const SUPABASE_KEY = "sb_publishable_p-43bJm9VjiMm1QWcDuVsA_8ubbO_Fb";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function register(){
  let phone=document.getElementById('phone').value.trim();
  let pass=document.getElementById('pass').value;
  let name=document.getElementById('name').value.trim();
  let msg=document.getElementById('msg');
  if(phone.length<10||pass.length<6||!name){msg.innerText='Enter valid phone, password 6+, and name';return}
  msg.innerText='Registering...';
  let email=phone+"@sbu.com";
  let {data,error}=await supabaseClient.auth.signUp({email:email,password:pass});
  if(error){msg.innerText=error.message;return}
  let user=data.user;
  if(user){
    await supabaseClient.from('profiles').insert([{id:user.id,phone:phone,full_name:name}]);
  }
  msg.innerText='Registered! Now pay 12,000 to 0758502917';
  checkUser();
}
async function login(){
  let phone=document.getElementById('phone').value.trim();
  let pass=document.getElementById('pass').value;
  let msg=document.getElementById('msg');
  let email=phone+"@sbu.com";
  let {data,error}=await supabaseClient.auth.signInWithPassword({email:email,password:pass});
  if(error){msg.innerText=error.message;return}
  msg.innerText='';checkUser();
}
async function checkUser(){
  let {data:{user}}=await supabaseClient.auth.getUser();
  if(!user) return;
  document.getElementById('auth').classList.add('hide');
  let {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',user.id).single();
  if(!profile || !profile.is_paid){
    document.getElementById('pay').classList.remove('hide');
  } else {
    document.getElementById('app').classList.remove('hide');
    document.getElementById('uname').innerText=profile.full_name||'User';
    document.getElementById('bal').innerText=profile.balance||0;
    loadWorks(profile);
  }
}
async function submitPay(){
  let tx=document.getElementById('txid').value.trim();
  if(tx.length<5){alert('Enter real Transaction ID');return}
  let {data:{user}}=await supabaseClient.auth.getUser();
  // For now mark as paid directly. You will verify TXID manually in Supabase.
  await supabaseClient.from('profiles').update({is_paid:true,txid:tx}).eq('id',user.id);
  alert('Payment submitted! TXID saved. You can now work.');
  location.reload();
}
function loadWorks(profile){
  let works=[{title:'Watch Video - Like & Comment',reward:500},{title:'Follow TikTok Page',reward:800},{title:'Share WhatsApp Status',reward:1000},{title:'Write Short Review',reward:1500}];
  document.getElementById('works').innerHTML=works.map(w=>'<div class="work"><b>'+w.title+'</b><br>'+w.reward+' UGX <button onclick="doWork('+w.reward+',\''+w.title+'\')">DO WORK</button></div>').join('');
  window.currentProfile=profile;
}
async function doWork(reward,title){
  let {data:{user}}=await supabaseClient.auth.getUser();
  let {data:profile}=await supabaseClient.from('profiles').select('*').eq('id',user.id).single();
  let newBal=(profile.balance||0)+reward;
  await supabaseClient.from('profiles').update({balance:newBal}).eq('id',user.id);
  document.getElementById('bal').innerText=newBal;
  alert('Done: '+title+' +'+reward+' UGX');
}
async function logout(){await supabaseClient.auth.signOut();location.reload()}
checkUser();
</script>
</body>
</html>
