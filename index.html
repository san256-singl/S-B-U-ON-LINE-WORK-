<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S-B-U ON-LINE WORK</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f2f2f2;margin:0;padding:15px}
.card{background:white;border-radius:15px;padding:20px;max-width:400px;margin:auto}
input{width:100%;padding:13px;margin:10px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:14px;border:none;border-radius:10px;background:#22c55e;color:white;font-weight:bold;font-size:16px}
.task{background:#f8f8f8;border-radius:12px;padding:15px;margin:12px 0}
.task button{background:#111}
.balance{background:#111;color:white;text-align:center;padding:20px;border-radius:12px}
.balance b{font-size:28px;color:#22c55e}
.hidden{display:none}
</style>
</head>
<body>
<div id="loginPage" class="card">
<h1 style="text-align:center">Welcome</h1>
<p style="text-align:center;color:gray">S-B-U ON-LINE WORK</p>
<input id="phone" placeholder="Phone e.g 0770492890">
<button onclick="login()">LOGIN / REGISTER</button>
<p id="msg" style="text-align:center;color:red"></p>
</div>
<div id="workPage" class="card hidden">
<b>S-B-U WORK</b> <span id="userPhone"></span>
<div class="balance"><div>Your Balance</div><b id="bal">UGX 0</b></div>
<div class="task"><b>1. Watch Video</b><br><br><button onclick="doTask(500)">EARN 500</button></div>
<div class="task"><b>2. Follow TikTok</b><br><br><button onclick="doTask(1000)">EARN 1000</button></div>
<div class="task"><b>3. Share Link</b><br><br><button onclick="doTask(1500)">EARN 1500</button></div>
<button onclick="logout()" style="background:#eee;color:#111">LOGOUT</button>
</div>
<script>
const SUPABASE_URL = "https://dhaqrimlmxgzyqhzggjn.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_p-43bJm9VjiMm1QWcDuVsA_8ubbO_Fb";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentPhone=""; let currentBalance=0;
async function login(){
let p=document.getElementById('phone').value.trim();
if(p.length<9){document.getElementById('msg').innerText='Enter correct phone';return;}
document.getElementById('msg').innerText='Loading...';
let {data,error}=await supabaseClient.from('profiles').select('*').eq('phone',p).maybeSingle();
if(error){document.getElementById('msg').innerText='ERROR: '+error.message;return;}
if(!data){let {error:e2}=await supabaseClient.from('profiles').insert({phone:p,balance:0}); if(e2){document.getElementById('msg').innerText='ERROR: '+e2.message;return;} currentBalance=0;}
else{currentBalance=data.balance||0;}
currentPhone=p; localStorage.setItem('sbu_phone',p);
document.getElementById('loginPage').classList.add('hidden');
document.getElementById('workPage').classList.remove('hidden');
document.getElementById('userPhone').innerText=p;
document.getElementById('bal').innerText='UGX '+currentBalance;
}
async function doTask(m){
currentBalance+=m;
let {error}=await supabaseClient.from('profiles').update({balance:currentBalance}).eq('phone',currentPhone);
if(error){alert('ERROR: '+error.message);return;}
document.getElementById('bal').innerText='UGX '+currentBalance;
alert('Earned UGX '+m+' - Saved in Supabase!');
}
function logout(){localStorage.removeItem('sbu_phone');location.reload();}
window.onload=async function(){let s=localStorage.getItem('sbu_phone'); if(s){document.getElementById('phone').value=s; await login();}}
</script>
</body>
</html>
