<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Register</title>
<style>
  *{box-sizing:border-box;font-family:Arial,sans-serif}
  body{margin:0;background:#f2f2f2;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
  .card{background:#fff;width:100%;max-width:380px;padding:24px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
  h2{text-align:center;margin:0 0 6px}
  p.sub{text-align:center;color:#666;font-size:14px;margin:0 0 18px}
  label{font-size:13px;font-weight:bold;display:block;margin:12px 0 6px}
  input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px;outline:none}
  input:focus{border-color:#25D366}
  .tabs{display:flex;background:#eee;border-radius:10px;padding:4px;margin-bottom:10px}
  .tabs button{flex:1;padding:11px;border:0;border-radius:8px;font-weight:bold;cursor:pointer;background:transparent}
  .tabs button.active{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1)}
  .btn{width:100%;padding:14px;border:0;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:16px;color:#fff;background:#25D366}
  .btn:disabled{opacity:.6}
  #msg{text-align:center;font-size:14px;margin-top:12px;min-height:20px;color:#d00}
  #msg.ok{color:green}
  .hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <h2>Welcome</h2>
  <p class="sub">Login or create account with phone</p>

  <div class="tabs">
    <button id="tabLogin" class="active" onclick="switchTab('login')">LOGIN</button>
    <button id="tabRegister" onclick="switchTab('register')">REGISTER</button>
  </div>

  <div id="registerFields" class="hidden">
    <label>Full Name</label>
    <input id="name" placeholder="e.g. John Doe">
  </div>

  <label>Phone Number</label>
  <input id="phone" placeholder="0770492890" inputmode="tel">

  <button id="mainBtn" class="btn" onclick="handleAuth()">LOGIN</button>
  <div id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://dhaqrimlmxgzyqhzggjn.supabase.co";
  const SUPABASE_ANON_KEY = "PASTE_YOUR_ANON_KEY_HERE";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let mode = 'login';

  function switchTab(m){
    mode = m;
    document.getElementById('tabLogin').classList.toggle('active', m==='login');
    document.getElementById('tabRegister').classList.toggle('active', m==='register');
    document.getElementById('registerFields').classList.toggle('hidden', m!=='register');
    document.getElementById('mainBtn').innerText = m==='login' ? 'LOGIN' : 'REGISTER';
    document.getElementById('msg').innerText = '';
  }

  function cleanPhone(p){
    p = p.trim().replace(/\s+/g,'');
    if(p.startsWith('+256')) return p;
    if(p.startsWith('256')) return '+' + p;
    if(p.startsWith('0')) return '+256' + p.slice(1);
    return p;
  }

  async function handleAuth(){
    const msg = document.getElementById('msg');
    const btn = document.getElementById('mainBtn');
    const phoneRaw = document.getElementById('phone').value;
    const name = document.getElementById('name').value.trim();
    const phone = cleanPhone(phoneRaw);

    if(!phoneRaw){ msg.innerText='Enter phone number'; return; }
    if(mode==='register' && !name){ msg.innerText='Enter your name'; return; }

    btn.disabled = true;
    btn.innerText = 'Checking...';
    msg.innerText = '';
    msg.classList.remove('ok');

    try{
      const { data, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('phone', phone)
        .maybeSingle();

      if(error) throw error;

      if(mode==='login'){
        if(!data){
          msg.innerText = 'No account found. Please REGISTER first.';
        } else {
          msg.innerText = 'Welcome back, ' + (data.name || '') + ' ✅ Login successful!';
          msg.classList.add('ok');
        }
      } else {
        if(data){
          msg.innerText = 'Account already exists. Please LOGIN.';
        } else {
          const { error: insertError } = await supabase
            .from('profiles')
            .insert([{ phone: phone, name: name }]);
          if(insertError) throw insertError;
          msg.innerText = 'Account created ✅ Now tap LOGIN';
          msg.classList.add('ok');
          switchTab('login');
        }
      }
    } catch(e){
      msg.innerText = 'Error: ' + e.message;
    }
    btn.disabled = false;
    btn.innerText = mode==='login' ? 'LOGIN' : 'REGISTER';
  }
</script>
</body>
</html>
